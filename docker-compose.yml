services:
  postgres:
    image: postgres:18-alpine
    container_name: radar_legislativo_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-radar_legislativo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - radar_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar_user} -d ${POSTGRES_DB:-radar_legislativo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  radar_pg_data:
